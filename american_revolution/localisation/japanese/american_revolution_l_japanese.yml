  USA_raise_militia_desc:0 "民兵を再度召集し、緊急の戦力補充を行う。"

  FRA_support_colonial_cause:0 "植民地蜂起への支援"
  FRA_support_colonial_cause_desc:0 "密輸路を利用して武器と資金を送り、反乱軍を支援する。"
  FRA_prepare_expeditionary_force:0 "遠征軍の準備"
  FRA_prepare_expeditionary_force_desc:0 "本国と植民地で志願兵を募り、派遣軍を整える。"
  GBR_raise_loyalist_militias:0 "忠誠派民兵の招集"
  GBR_raise_loyalist_militias_desc:0 "王党派住民に武器を配り、占領地の防衛を強化する。"
  GBR_enforce_coastal_blockade:0 "沿岸封鎖の徹底"
  GBR_enforce_coastal_blockade_desc:0 "港の出入りを厳しく監視し、反乱軍の交易を遮断する。"
  GBR_offer_concessions:0 "宥和案の提示"
  GBR_offer_concessions_desc:0 "自治拡大の提案を行い、交渉の余地を見せる。"

  USA_french_alliance:0 "仏米友好条約"
  USA_treaty_of_alliance:0 "同盟締結"
  USA_spanish_trade:0 "スペインとの密約"
  FRA_secret_aid:0 "秘密補助金"
  GBR_french_rivalry:0 "英仏宿怨"
  FRA_spanish_coordination:0 "スペインとの協調"
  FRA_war_of_vengeance:0 "復讐戦争"
  GBR_conciliation_offer:0 "宥和提案"

  american_revolution.1.t:0 "新国家の誕生"
  american_revolution.1.d:0 "フィラデルフィアの州議事堂では、自らを合衆国と称した代表たちが新生国家の礎を刻むべく夜を徹して議論を重ねている。\n\n戦争の炎が燃え盛る中でも、自由と共和の理念を文書に落とし込む責務は一刻の猶予も許さない。議場の外では民兵と市民が鼓動を合わせ、独立の未来を待ち望んでいる。"
  american_revolution.1.a:0 "自由の鐘を鳴らせ"
  american_revolution.1.b:0 "軍政会議を拡充せよ"

  american_revolution.2.t:0 "民兵の総蜂起"
  american_revolution.2.d:0 "各州の集会場では、鍛冶屋も農夫も銃を手に列を成し、新たな大陸軍への編入を待っている。\n\n彼らは故郷を守るため直ちに戦線へ向かう覚悟を決めているが、指揮官たちは訓練と統率を整える時間も欲している。決断次第で戦争の初動は大きく変わる。"
  american_revolution.2.a:0 "勇気をそのまま戦場へ送れ"
  american_revolution.2.b:0 "訓練と補給を優先せよ"

  american_revolution.3.t:0 "サラトガの勝利"
  american_revolution.3.d:0 "サラトガの原野で、ゲイツとアーノルドが率いる軍勢は敵の縦隊を巧みに包囲し、英国軍に大敗を喫させた。\n\nこの勝利は大陸軍の士気を一気に押し上げ、遠くヨーロッパの宮廷にまで雷鳴のような衝撃を与えている。今こそ勝利をいかに活用するかを決しなければならない。"
  american_revolution.3.a:0 "勝利を火のように伝えよ"
  american_revolution.3.b:0 "外交交渉の切り札とせよ"

  american_revolution.4.t:0 "憲法制定会議"
  american_revolution.4.d:0 "十三州の代表が机を囲み、共和国を支える制度と権力の均衡について熱を帯びた議論を交わしている。\n\n腐敗を避けながらも強い政府を築くには、理念だけでなく緻密な設計図が必要である。彼らの決断が後世の運命を左右する。"
  american_revolution.4.a:0 "共和国徳を掲げよ"
  american_revolution.4.b:0 "制度を緻密に構築せよ"

  american_revolution.5.t:0 "諸国からの承認"
  american_revolution.5.d:0 "ヨーロッパの宮廷で交わされた署名と印章が、大西洋を越えてわが首都に届けられた。\n\n友邦は新国家を正式に認め、交易路と外交儀礼が再び開かれる。自由の理想が世界に響き渡る瞬間である。"
  american_revolution.5.a:0 "軍旗に新たな星を加えよ"
  american_revolution.5.b:0 "宮廷とサロンを行脚せよ"

  american_revolution.6.t:0 "南部遠征"
  american_revolution.6.d:0 "大陸軍は湿地と農園を抜け、南部の人々と肩を並べて行軍している。\n\n王党派と共和派が入り混じる土地での統治には、軍靴だけでなく説得と保護も欠かせない。行軍の手綱をどのように握るべきか。"
  american_revolution.6.a:0 "勢いのまま前進せよ"
  american_revolution.6.b:0 "統治網を築き固めよ"

  american_revolution.7.t:0 "戦場司令部の再編"
  american_revolution.7.d:0 "ヴァレー・フォージの野営地では、将軍たちが地図と報告書を前に軍の指揮系統を根本から見直している。\n\n散在する民兵と正規軍をひとつに束ねるには、素早い伝令と柔軟な作戦術が不可欠だ。議会はどこまで指揮権を委ねるべきか。"
  american_revolution.7.a:0 "前線に統合参謀を派遣せよ"
  american_revolution.7.b:0 "議会監督を強めよ"

  american_revolution.8.t:0 "連合会議の権力闘争"
  american_revolution.8.d:0 "フィラデルフィアに集った代表は、戦時における徴税と軍備の権限をどこまで中央に集中させるかを巡って激しい論争を繰り広げている。\n\n州の自治を尊ぶ声と、統一された指導力を求める叫びが議場に交錯し、机上には妥協案の巻物が積み上がった。"
  american_revolution.8.a:0 "全権を会議に集約せよ"
  american_revolution.8.b:0 "州の声を保証せよ"

  american_revolution.9.t:0 "自由の凱旋行進"
  american_revolution.9.d:0 "ペンシルベニア街道には勝利に沸く市民が集まり、鼓笛隊が新しい共和国の行進曲を奏でている。\n\n戦場から帰還した将兵は疲労と誇りを胸に秘め、祖国が示す感謝の形を待ち望んでいる。祝宴の後に続く国家建設をどう描くべきか。"
  american_revolution.9.a:0 "ペンシルベニア街道に行軍せよ"
  american_revolution.9.b:0 "退役軍人基金を創設せよ"

  american_revolution.10.t:0 "帝国戦略会議"
  american_revolution.10.d:0 "ロンドンのホワイトホールでは閣僚と将官が集い、反乱鎮圧のための大戦略を夜通し審議している。\n\n強硬派は海軍力と遠征軍の総動員を唱え、穏健派は自治権の譲歩で戦費を抑えるべきだと主張する。帝国の威信を示す舵取りが問われている。"
  american_revolution.10.a:0 "剣を抜いて鎮圧せよ"
  american_revolution.10.b:0 "妥協の余地を探れ"

  american_revolution.11.t:0 "南部戦線の転機"
  american_revolution.11.d:0 "チャールストンの港では補給船が並び、カロライナの湿地では英軍が新たな作戦図を描いている。\n\n反乱軍の焦点をどこに定めるかで、忠誠派の蜂起と補給線の維持が左右される。将軍たちの意見は依然として割れたままだ。"
  american_revolution.11.a:0 "攻勢を強行せよ"
  american_revolution.11.b:0 "兵站を立て直せ"

  american_revolution.12.t:0 "カリブ海作戦"
  american_revolution.12.d:0 "西インド諸島の碧い海では、私掠船と戦列艦が衝突を繰り返し、砂糖と銀の流れが揺らいでいる。\n\n艦隊の指揮官は、危険な遠征で敵の交易を断つか、それとも政治工作に資源を振り向けるか判断を迫られている。"
  american_revolution.12.a:0 "海軍の栄光に賭けよ"
  american_revolution.12.b:0 "外交の手綱を引け"

  american_revolution.13.t:0 "和平委員会の報告"
  american_revolution.13.d:0 "新大陸から戻った特使団は、植民地指導者との密談記録と慎重な譲歩案を携えてロンドンに帰還した。\n\n彼らは自治の拡大と戦費軽減の見返りに忠誠の誓いを取り付けられると主張するが、強硬派はそれを裏切りと断じている。"
  american_revolution.13.a:0 "提案を受け入れよ"
  american_revolution.13.b:0 "強硬策を貫け"

  american_revolution.14.t:0 "フランスへの対抗"
  american_revolution.14.d:0 "ヴェルサイユ宮殿での動きが伝わるにつれ、ロンドンでは仏国の介入に備える緊急会議が相次いでいる。\n\n帝国は外交圧力で孤立させるか、海上決戦で威勢を示すか、二つの道を天秤にかけている。"
  american_revolution.14.a:0 "政治的圧力を強めよ"
  american_revolution.14.b:0 "海軍力で示威せよ"

  american_revolution.15.t:0 "帝国の将来"
  american_revolution.15.d:0 "長期戦が帝国の財政と世論を蝕み、議会では大英帝国の再建案が真剣に議論されている。\n\n植民地統治の改革か、軍事力の抜本強化か、選択を誤れば帝国の均衡は崩壊しかねない。"
  american_revolution.15.a:0 "統治改革を断行せよ"
  american_revolution.15.b:0 "軍事力に磨きをかけよ"

  american_revolution.16.t:0 "ヘッセン契約軍の到着"
  american_revolution.16.d:0 "ドイツ諸邦との契約に基づき、規律正しいヘッセン兵がロンドンの埠頭に降り立った。\n\n彼らを帝国軍に組み込み迅速に派遣するか、別働隊として慎重に運用するかが議論されている。"
  american_revolution.16.a:0 "即座に帝国軍に編入せよ"
  american_revolution.16.b:0 "独立指揮下で運用せよ"

  american_revolution.17.t:0 "忠誠派の蜂起"
  american_revolution.17.d:0 "王党派の住民が各地で集会を開き、英国王への誓いを新たにして武器を求めている。\n\n彼らを地方防衛の要とするか、それとも情報網として活用するか、占領政策の成否を分ける決断が迫られる。"
  american_revolution.17.a:0 "地元防衛を任せよ"
  american_revolution.17.b:0 "諜報と工作に活用せよ"

  american_revolution.18.t:0 "帝国再配備評議"
  american_revolution.18.d:0 "海軍省とインド省の役人が地図の上で部隊と艦隊の再配備案を突き合わせ、大西洋とインド洋の優先度を巡って激論している。\n\n遠征軍の主力をどこへ向けるかで、帝国の未来の支配圏が決まる。"
  american_revolution.18.a:0 "艦隊を大西洋に集中させよ"
  american_revolution.18.b:0 "インドと本国を固めよ"

  american_revolution.20.t:0 "フランスの介入"
  american_revolution.20.d:0 "ヴェルサイユの鏡の間では、ブルボン朝の重臣がアメリカ独立戦争への全面介入を決するため密議を重ねている。\n\n英国への復讐心と財政的な不安が互いに火花を散らし、王も王妃も決断を迫られている。"
  american_revolution.20.a:0 "同盟条約に署名せよ"
  american_revolution.20.b:0 "時期尚早と退けよ"

  american_revolution.21.t:0 "植民地協議会"
  american_revolution.21.d:0 "カリブ海の総督と提督がパリに召集され、砂糖諸島と北米を結ぶ作戦計画を練っている。\n\n資源と兵站を共有する枠組みが形になりつつあり、帝国の知恵が試されている。"
  american_revolution.21.a:0 "研究体制を強化せよ"
  american_revolution.21.b:0 "国内の安定を優先せよ"

  american_revolution.22.t:0 "カリブ遠征の成果"
  american_revolution.22.d:0 "仏艦隊が敵の輸送船団を拿捕したとの報せがパリに届き、港町は祝砲に沸いている。\n\nこの機を逃さずさらに攻勢をかけるか、それとも外交上の成果として利用するかが議論されている。"
  american_revolution.22.a:0 "戦果を拡大せよ"
  american_revolution.22.b:0 "政治的利益を収穫せよ"

  american_revolution.23.t:0 "遠征軍の整備"
  american_revolution.23.d:0 "ラファイエット子爵やロシャンボー伯が指揮する派遣軍が、装備と兵站を整えつつフランス港湾で結集している。\n\n大西洋の風が味方する今こそ出航すべきか、それとも慎重に準備を重ねるか。"
  american_revolution.23.a:0 "即座に出航させよ"
  american_revolution.23.b:0 "慎重に準備を進めよ"

  american_revolution.24.t:0 "啓蒙思想の高揚"
  american_revolution.24.d:0 "パリのサロンでは哲学者と官僚が夜明けまで議論を続け、自由と改革の理念が火花のように飛び交っている。\n\n思想の奔流を国家改革へと導くか、それとも国民の士気へと転化するかで、革命の方向性が決まる。"
  american_revolution.24.a:0 "知の交流を推進せよ"
  american_revolution.24.b:0 "国民を鼓舞せよ"

  american_revolution.25.t:0 "革命を守る使命"
  american_revolution.25.d:0 "王政と共和の狭間で揺れるフランスは、自由の理念を守るために国内外で重い責務を負っている。\n\n内政の均衡を保つか、さらなる改革へと歩を進めるか、未来を決する岐路に立っている。"
  american_revolution.25.a:0 "団結を呼びかけよ"
  american_revolution.25.b:0 "改革をさらに進めよ"

  american_revolution.26.t:0 "秘密補助金の拡張"
  american_revolution.26.d:0 "タヴェルヌの裏部屋で密使と商人が契約書に印を押し、アメリカへの新たな支援物資が積み込まれている。\n\nこの地下取引を拡張すれば英国の目を欺けるが、財務省にはさらなる負担がのしかかる。"
  american_revolution.26.a:0 "支援の水路を広げよ"
  american_revolution.26.b:0 "財務を優先して抑制せよ"

  american_revolution.27.t:0 "補給改革委員会"
  american_revolution.27.d:0 "軍需官僚がル・アーブルとブレストの倉庫を巡り、弾薬と食糧の流れを一本化する新制度を練り上げている。\n\n貴族の特権を削って軍需庫を整えるか、商人と提携して資金を引き出すか、選択が迫られている。"
  american_revolution.27.a:0 "軍需庫を徹底的に整備せよ"
  american_revolution.27.b:0 "港湾商人と提携せよ"

  american_revolution.28.t:0 "復讐戦争の檄"
  american_revolution.28.d:0 "戦争大臣は宮廷に集まった将官の前で、七年戦争の雪辱を果たすと高らかに宣言した。\n\n大西洋を制する遠征を企図するのか、それとも国家再建のため内政へ力を割くのか、フランスの進路がここで定まる。"
  american_revolution.28.a:0 "復讐の艦隊を差し向けよ"
  american_revolution.28.b:0 "祖国の再建を優先せよ"

